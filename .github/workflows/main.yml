name: Windows RDP

on:
  workflow_dispatch:   # Hanya bisa dijalankan manual

jobs:
  build:
    runs-on: windows-latest   # Runner Windows

    steps:
      # Download dan setup Ngrok
      - name: Set up Ngrok
        run: |
          Invoke-WebRequest -Uri "https://bin.equinox.io/c/4VmDzA7iaHb/ngrok-stable-windows-amd64.zip" -OutFile ngrok.zip
          Expand-Archive ngrok.zip -DestinationPath .
          ./ngrok authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

      # Aktifkan Remote Desktop
      - name: Enable RDP
        run: |
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
          Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

      # Buat user dan password
      - name: Create user and set password
        run: |
          $user = "GitHubRunner"
          $password = "P@ssw0rd!123"   # Ganti dengan password kuat!
          net user $user $password /add /Y
          net localgroup administrators $user /add

      # Jalankan Ngrok untuk expose port 3389 (RDP)
      - name: Create RDP tunnel with Ngrok
        run: |
          Start-Process -FilePath "./ngrok.exe" -ArgumentList "tcp 3389" -NoNewWindow
          Start-Sleep -Seconds 5   # Tunggu Ngrok menyala
          (Invoke-WebRequest -Uri http://localhost:4040/api/tunnels -UseBasicParsing).Content | ConvertFrom-Json | Select-Object -Expand tunnels | Where-Object { $_.proto -eq 'tcp' } | Select-Object -First 1 public_url | Out-File "ngrok_url.txt"
          Get-Content ngrok_url.txt   # Tampilkan URL di log (lihat di Actions)

      # Tahan job agar tetap hidup (maks 6 jam)
      - name: Keep alive
        run: |
          Write-Host "RDP aktif! Gunakan alamat Ngrok di atas untuk terhubung."
          Write-Host "Job akan berjalan selama 6 jam (batas maks GitHub)."
          Start-Sleep -Seconds 21600   # 6 jam
